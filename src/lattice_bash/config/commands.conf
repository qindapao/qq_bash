# lattice command palette entries — SHIPPED EXAMPLE ONLY
# This file is frozen as a smoke-test / format example. Do not add real user
# commands here. Copy it to your portable user config and maintain that copy.
#
# Format: lattice_command NAME SCOPE TARGET COMMAND [SNAPSHOT] [PARAMS]
# There are no command shortcut keys. Open the palette with ':' and type to
# filter; Enter sends and leaves the palette open; Esc exits the palette.
#
# NAME    shown in the palette and matched by search
# SCOPE   dir / file / any (documentation only)
# TARGET  pane
# COMMAND trusted bash, executed in the right pane
# SNAPSHOT optional help text shown by p / right-click
# PARAMS  optional whitespace-separated parameter names

lattice_command 'enter current directory' 'dir' 'pane' 'cd "$WB_DIR"' '切换到左侧文件树的当前目录，右侧 prompt 会同步变化。'
lattice_command 'grep current tree' 'dir' 'pane' 'grep -rn --color=auto -- "$LP_PATTERN" "$WB_DIR"' '按模式搜索当前文件树；PATTERN 为必填参数。' 'PATTERN'
lattice_command 'git status (current)' 'dir'  'pane' 'GIT_TERMINAL_PROMPT=0 git -C "$WB_DIR" status --short --branch' '只查看当前目录的 git 状态，不扫描其它仓库。'
lattice_command 'git check all repos' 'dir'  'pane' 'GIT_TERMINAL_PROMPT=0 timeout 60 git_check_status.sh -o "$WB_DIR"'
lattice_command 'git diff'             'file' 'pane' 'git diff -- "$WB_FILE"' '查看当前选中文件的未暂存 diff。'
lattice_command 'git diff cached'      'dir'  'pane' 'git diff --cached'
lattice_command 'git log'              'dir'  'pane' 'git log --oneline --decorate -20'
lattice_command 'git show HEAD'        'dir'  'pane' 'git show --stat --oneline HEAD'
lattice_command 'list directory'       'dir'  'pane' 'ls -la "$WB_DIR"'
lattice_command 'pwd'                  'dir'  'pane' 'pwd'
lattice_command 'run tests'            'dir'  'pane' 'bash test.sh'
lattice_command 'build'                'dir'  'pane' 'bash build.sh'
lattice_command 'view file'            'file' 'pane' '${PAGER:-less} "$WB_FILE"' '用分页器只读查看当前文件，退出后回到右侧 shell。'
lattice_command 'edit file'            'file' 'pane' '${EDITOR:-vi} "$WB_FILE"'
lattice_command 'disk usage'           'dir'  'pane' 'du -sh "$WB_DIR"'
lattice_command 'find files'           'dir'  'pane' 'find "$WB_DIR" -maxdepth 2 -type f | head -100'
