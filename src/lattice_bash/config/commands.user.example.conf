# Example user commands. Copy to your portable config:
#   $EDITOR /x/.lattice/commands.user.conf
#
# This file is intentionally not loaded by Lattice.
#
# Quoting rules used below:
#   '...'    literal: $ * # ( ) { } ! ; | & are preserved
#   "..."    expands $VAR; use \$ for a literal dollar
#   $'...'   Bash ANSI-C: \n, \t, \\ are real control characters
#
# The fifth argument is the snapshot; an empty string means no snapshot.
# Everything after the snapshot is a parameter. Use {{NAME}} placeholders;
# values are shell-quoted and expanded before execution.

# @ prefix: insert-only skeleton. The command is pasted without Enter and is
# not written to history. The user switches to the executor and finishes it.
lattice_command '@ssh' 'dir' 'pane' 'ssh ' '插入 SSH 骨架；不会自动执行。'

# Complex grep with a snapshot.
#   -n line numbers, -H filename, -E extended regex, -r recursive
lattice_command 'grep complex errors' 'dir' 'pane' \
  "grep -nHE --color=auto --include='*.log' -r '^(ERROR|WARN|FATAL)[[:space:]]+.*(timeout|connection refused|permission denied|reset by peer)' ." \
  '在 *.log 中查找 ERROR/WARN/FATAL 及网络/权限错误关键字；从执行器当前目录递归。'

# Escaped characters for printf. The doubled backslashes leave literal \t and
# \n in the stored command; printf interprets them in the executor.
lattice_command 'printf escaped' 'dir' 'pane' \
  $'printf "name\\tvalue\\n"' \
  '输出 name<TAB>value 并换行；演示配置中的 \\t 和 \\n。'

# A literal backslash for an external regex.
lattice_command 'grep dotted numbers' 'dir' 'pane' \
  'grep -nHE --color=auto -r "\.[0-9]+" .' \
  '匹配点号后的数字；反斜杠保留给 grep。'

# Multiple parameters, passed as separate arguments after the snapshot.
lattice_command 'grep in target' 'dir' 'pane' \
  'grep -nHE --color=auto -- {{PATTERN}} {{TARGET_DIR}}' \
  '搜索指定目录；PATTERN 必填，TARGET_DIR 默认当前目录。' \
  'PATTERN' 'TARGET_DIR=.'

# Empty snapshot + parameters. No * marker is shown.
lattice_command 'printf two params' 'dir' 'pane' \
  'printf "A=%s B=%s\n" {{A}} {{B}}' \
  '' \
  'A' 'B=default'

# Literal metacharacters. The stored command keeps a single-quoted literal
# argument, so the shell does not glob or expand it.
lattice_command 'literal metachars' 'dir' 'pane' \
  "printf '%s\n' 'literal * \$ # ( ) { } [ ] ? ! & | ;'" \
  '元字符按字面量输出；注意配置层和命令层各自需要引用。'

# find needs escaped parentheses and quoted globs.
lattice_command 'find log files' 'dir' 'pane' \
  'find . -type f \( -name "*.log" -o -name "*.txt" \) -print' \
  '查找当前目录下的 .log/.txt；括号和通配符需要引用或转义。'

# awk uses $1, so the dollar must be escaped in the double-quoted config
# argument. The stored command is: printf '%s\n' 'a b' | awk '{print $1}'
lattice_command 'awk first column' 'dir' 'pane' \
  "printf '%s\\n' 'a b' | awk '{print \$1}'" \
  '打印文本第一列；演示 $、管道和配置层转义。'

# Command substitution and arithmetic are evaluated by the executor, not by
# the config file, because the command is single-quoted here.
lattice_command 'shell expansions' 'dir' 'pane' \
  'printf "date=%s sum=%s\n" "$(date +%F)" "$((1 + 2))"' \
  '演示 $() 和 $((...)) 在执行器里展开。'

# Recursive extended-regex search with match highlighting and context.
# FILE_SUFFIX is the bare suffix (log, txt, ...), not ".log".
# CONTEXT is the number of lines before and after each match (-C).
# PATTERN is the user's raw ERE; Lattice quotes it, grep interprets it.
lattice_command 'grep recursive regex' 'dir' 'pane' \
  'grep -nHE -C{{CONTEXT}} --color=auto --include="*."{{FILE_SUFFIX}} -r -- {{PATTERN}} {{WB_DIR}}' \
  '递归搜索当前树目录下指定后缀；显示匹配前后各 CONTEXT 行。' \
  'FILE_SUFFIX=log' 'CONTEXT=3' 'PATTERN'

# Raw parameter insertion: no @Q. Always preview-only; the user presses Enter.
# PATTERN is a shell glob such as *.txt.
lattice_command 'list txt' 'dir' 'pane' \
  'printf "%s\n" [{PATTERN}]' \
  '裸写 glob；只插入，不自动执行。' \
  'PATTERN=*.txt'

# Raw values inside shell brace expansion.
lattice_command 'brace range' 'dir' 'pane' \
  'echo {[{START}]..[{END}]}' \
  '裸写数字范围；只插入，不自动执行。' \
  'START=1' 'END=3'

# One smoke test for every expansion form: quoted, ANSI-C, raw glob, raw
# brace, trusted paths, registers and clipboard. Raw arguments are printed
# by separate printf calls so their word count cannot shift later arguments.
lattice_command 'printf validation matrix' 'dir' 'pane' \
  "printf 'QUOTED=<%s>\\n' {{QUOTED}}; printf 'ANSI=<%s>\\n' {{ANSI}}; printf 'RAW=<%s>\\n' [{RAW}]; printf 'BRACE=<%s>\\n' {[{START}]..[{END}]}; printf 'DIR_Q=<%s>\\n' {{WB_DIR}}; printf 'DIR_R=<%s>\\n' [{WB_DIR}]; printf 'FILE=<%s>\\n' {{WB_FILE}}; printf 'A=<%s>\\nB=<%s>\\nC=<%s>\\nCLIP=<%s>\\n' {{WB_A}} {{WB_B}} {{WB_C}} {{WB_CLIP}}" \
  '一次验证所有占位符形式；只插入，不自动执行。' \
  'QUOTED=hello world * $ #' ANSI=$'a\tb' 'RAW=*.txt' 'START=1' 'END=3'

# Fixed-string grep: the parameter value may contain * $ # ( ) } literally.
lattice_command 'grep literal needle' 'dir' 'pane' \
  'grep -nFr -- {{NEEDLE}} {{WB_DIR}}' \
  '固定字符串搜索；可输入 * $ # ( ) } 等元字符。' \
  'NEEDLE=*'

# ---- clipboard and registers -------------------------------------------------

# Compare two files/paths. Put one path in A and another in B:
#   tree: @a / @b
#   executor: Ctrl-b a / Ctrl-b b from the clipboard
lattice_command 'diff A B' 'dir' 'pane' \
  'diff -u {{WB_A}} {{WB_B}}' \
  '比较寄存器 A/B 指向的两个文件。'

# Compare two commits, branches, tags, or files already placed in A/B.
lattice_command 'git diff A B' 'dir' 'pane' \
  'git diff {{WB_A}} {{WB_B}}' \
  '比较 A/B 两个 commit、分支、标签或文件。'

# Three-dot form: diff from the merge base of A to B.
lattice_command 'git diff A...B' 'dir' 'pane' \
  'git diff {{WB_A}}...{{WB_B}}' \
  '比较 A 与 B 的 merge-base 差异。'

# Three-way comparison. Typical setup:
#   A = current file, B = base, C = other side
lattice_command 'diff3 A B C' 'dir' 'pane' \
  'diff3 {{WB_A}} {{WB_B}} {{WB_C}}' \
  '三方比较；A=当前，B=基线，C=另一侧。'

# Simplest smoke test: print all four dynamic values as literals.
lattice_command 'print CLIP A B C' 'any' 'pane' \
  'printf "CLIP=%s\nA=%s\nB=%s\nC=%s\n" {{WB_CLIP}} {{WB_A}} {{WB_B}} {{WB_C}}' \
  '按字面量打印 CLIP/A/B/C，用于检查寄存器和剪贴板内容。'

# Snapshot containing shell metacharacters. It is display-only text.
# The outer double quotes let the inner single-quoted printf format stay
# readable; \\n becomes \n when the config is sourced.
lattice_command 'snapshot metachars' 'dir' 'pane' \
  "printf '%s\\n' 'snapshot demo'" \
  '快照里的 * $ # ( ) { } 都只是文本，不参与执行。'

# Pipe and redirection.
lattice_command 'count log lines' 'dir' 'pane' \
  'grep -c . --include="*.log" -r . 2>/dev/null' \
  '统计当前目录 *.log 的非空行；错误输出丢弃。'
